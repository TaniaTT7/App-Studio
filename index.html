<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Asistente Exámenes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: white; 
            min-height: 100vh;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { 
            font-size: 22px; 
            margin: 10px 0;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 10px;
        }
        #videoContainer {
            width: 100%;
            max-width: 900px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: 10px 0;
            background: #000;
            aspect-ratio: 16/9;
        }
        #video { 
            width: 100%; 
            height: 100%;
            object-fit: cover;
            display: block;
        }
        #canvas { display: none; }
        
        .controls { 
            display: flex; 
            gap: 10px; 
            margin: 15px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        button { 
            padding: 14px 24px; 
            font-size: 15px; 
            font-weight: bold;
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        button:active { transform: scale(0.95); }
        #startBtn { background: #00d084; color: #000; }
        #stopBtn { background: #ff4757; color: white; }
        #captureBtn { background: #ffd93d; color: #000; }
        button:disabled { 
            background: #555; 
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #status { 
            margin: 15px 0; 
            padding: 20px; 
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px; 
            width: 100%; 
            max-width: 900px;
            min-height: 120px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        #status p {
            font-size: 16px;
            margin-bottom: 10px;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .result-box {
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .answer-highlight { 
            font-size: 18px; 
            font-weight: bold;
            color: #00ff88; 
            padding: 10px;
            background: rgba(0,255,136,0.15);
            border-left: 4px solid #00ff88;
            border-radius: 5px;
            margin: 10px 0;
        }
        .timer {
            font-size: 20px;
            font-weight: bold;
            color: #ffd93d;
            margin: 10px 0;
            text-align: center;
        }
        .settings {
            margin: 10px 0;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            width: 100%;
            max-width: 900px;
        }
        .settings label {
            display: block;
            margin: 10px 0 5px;
            font-size: 14px;
            color: #ccc;
        }
        .settings input, .settings select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 16px;
        }
        .settings-row {
            display: flex;
            gap: 10px;
        }
        .settings-row > div {
            flex: 1;
        }
        .log {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            font-size: 12px;
            color: #aaa;
            max-height: 150px;
            overflow-y: auto;
            width: 100%;
            max-width: 900px;
        }
        .log-entry {
            margin: 3px 0;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .log-success { color: #00ff88; }
        .log-error { color: #ff4757; }
        .log-info { color: #74b9ff; }
        
        @media (max-width: 600px) {
            h1 { font-size: 18px; }
            button { padding: 12px 18px; font-size: 13px; }
            .settings-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <h1>📸 Asistente de Exámenes</h1>
    <p class="subtitle">Powered by Gemini 2.0 Flash</p>
    
    <div class="settings">
        <div class="settings-row">
            <div>
                <label>⏱️ Intervalo (seg):</label>
                <input type="number" id="intervalo" value="40" min="10" max="300">
            </div>
            <div>
                <label>🔊 Volumen:</label>
                <select id="volumen">
                    <option value="0.5">Bajo</option>
                    <option value="1" selected>Normal</option>
                    <option value="1.5">Alto</option>
                </select>
            </div>
        </div>
        <div style="margin-top:10px;">
            <label>🔑 API Key de Gemini:</label>
            <input type="password" id="apiKey" placeholder="Pega aquí tu API key de Gemini">
        </div>
    </div>
    
    <div id="videoContainer">
        <video id="video" autoplay playsinline muted></video>
    </div>
    <canvas id="canvas"></canvas>
    
    <div class="controls">
        <button id="startBtn">▶️ Iniciar</button>
        <button id="stopBtn" disabled>️ Detener</button>
        <button id="captureBtn" disabled>📸 Manual</button>
    </div>
    
    <div id="status">
        <p> Estado: Listo para iniciar</p>
        <div id="timer" class="timer"></div>
        <div id="result"></div>
    </div>
    
    <div class="log" id="log">
        <div class="log-entry log-info">📋 Log de actividad aparecerá aquí...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const captureBtn = document.getElementById('captureBtn');
        const status = document.getElementById('status');
        const result = document.getElementById('result');
        const timerDisplay = document.getElementById('timer');
        const intervaloInput = document.getElementById('intervalo');
        const volumenSelect = document.getElementById('volumen');
        const apiKeyInput = document.getElementById('apiKey');
        const logDiv = document.getElementById('log');
        
        let stream = null;
        let intervalId = null;
        let countdownId = null;
        let countdown = 0;
        let isProcessing = false;
        
        // Guardar API key en localStorage
        apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
        apiKeyInput.addEventListener('change', () => {
            localStorage.setItem('gemini_api_key', apiKeyInput.value);
        });
        
        function addLog(msg, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const time = new Date().toLocaleTimeString();
            entry.textContent = `[${time}] ${msg}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            
            // Mantener solo últimos 50 entries
            while (logDiv.children.length > 50) {
                logDiv.removeChild(logDiv.firstChild);
            }
        }
        
        async function startCamera() {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                updateStatus('❌ Ingresa tu API Key de Gemini primero');
                addLog('API Key vacía', 'error');
                return;
            }
            localStorage.setItem('gemini_api_key', apiKey);
            
            try {
                updateStatus('📷 Solicitando cámara...');
                addLog('Iniciando cámara...', 'info');
                
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: { exact: 'environment' },
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                });
                
                video.srcObject = stream;
                await video.play();
                
                startBtn.disabled = true;
                stopBtn.disabled = false;
                captureBtn.disabled = false;
                
                updateStatus('✅ Cámara activa. Iniciando...');
                addLog('Cámara activa', 'success');
                
                await captureAndAnalyze();
                startAutoCycle();
                
            } catch (err) {
                console.error('Error cámara:', err);
                if (err.name === 'NotAllowedError') {
                    updateStatus('❌ Permiso de cámara denegado');
                    addLog('Permiso cámara denegado', 'error');
                } else if (err.name === 'NotFoundError') {
                    updateStatus('❌ No hay cámara trasera disponible');
                    addLog('No cámara trasera', 'error');
                    // Intentar con cualquier cámara
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({ video: true });
                        video.srcObject = stream;
                        await video.play();
                        addLog('Usando cámara frontal como fallback', 'info');
                        startBtn.disabled = true;
                        stopBtn.disabled = false;
                        captureBtn.disabled = false;
                        await captureAndAnalyze();
                        startAutoCycle();
                    } catch (e2) {
                        updateStatus('❌ No se pudo acceder a ninguna cámara');
                    }
                } else {
                    updateStatus('❌ Error: ' + err.message);
                    addLog('Error cámara: ' + err.message, 'error');
                }
            }
        }
        
        function startAutoCycle() {
            const intervalo = parseInt(intervaloInput.value) * 1000;
            countdown = parseInt(intervaloInput.value);
            updateCountdown();
            
            intervalId = setInterval(async () => {
                if (!isProcessing) {
                    await captureAndAnalyze();
                }
                countdown = parseInt(intervaloInput.value);
            }, intervalo);
            
            countdownId = setInterval(() => {
                countdown--;
                updateCountdown();
            }, 1000);
        }
        
        function updateCountdown() {
            if (countdown > 0) {
                timerDisplay.textContent = `⏱️ Siguiente captura en: ${countdown}s`;
            } else {
                timerDisplay.textContent = '️ Procesando...';
            }
        }
        
        async function captureAndAnalyze() {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey) {
                updateStatus('❌ API Key requerida');
                return;
            }
            
            if (isProcessing) {
                addLog('Proceso anterior aún en curso, saltando...', 'info');
                return;
            }
            
            isProcessing = true;
            
            try {
                updateStatus('📸 Capturando...');
                addLog('Capturando imagen...', 'info');
                
                canvas.width = video.videoWidth || 1920;
                canvas.height = video.videoHeight || 1080;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                // Convertir a base64 (sin el prefijo data:image/jpeg;base64,)
                const base64Image = canvas.toDataURL('image/jpeg', 0.75).split(',')[1];
                
                updateStatus('🤖 Analizando con Gemini...');
                addLog('Enviando a Gemini...', 'info');
                
                const prompt = `Eres un asistente experto en exámenes universitarios. Analiza esta imagen de una pantalla de examen.

INSTRUCCIONES:
1. Identifica la MATERIA (texto centrado en la parte superior)
2. Extrae el NÚMERO DE REACTIVO
3. Copia la PREGUNTA completa y exacta
4. Extrae las 4 OPCIONES de respuesta tal como aparecen
5. Determina la RESPUESTA CORRECTA con base en conocimiento académico sólido
6. Da una explicación breve de por qué es correcta

FORMATO EXACTO DE RESPUESTA:
📚 MATERIA: [nombre de la materia]
🔢 REACTIVO: [número]
❓ PREGUNTA: [texto completo de la pregunta]

📝 OPCIONES:
A) [texto opción A]
B) [texto opción B]
C) [texto opción C]
D) [texto opción D]

✅ RESPUESTA CORRECTA: [Letra] - [texto exacto de la respuesta correcta]

💡 EXPLICACIÓN: [1-2 líneas justificando la respuesta]

Si no puedes leer claramente la imagen, responde: "❓ NO PUEDO LEER - La imagen no es clara enough para analizar."`;

                // Llamada a Gemini 2.0 Flash
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    {
                                        text: prompt
                                    },
                                    {
                                        inline_data: {
                                            mime_type: 'image/jpeg',
                                            data: base64Image
                                        }
                                    }
                                ]
                            }],
                            generationConfig: {
                                temperature: 0.2,
                                maxOutputTokens: 500,
                            }
                        })
                    }
                );
                
                if (!response.ok) {
                    const errorData = await response.json();
                    const errorMsg = errorData.error?.message || `HTTP ${response.status}`;
                    throw new Error(errorMsg);
                }
                
                const data = await response.json();
                
                // Extraer texto de la respuesta de Gemini
                const analysis = data.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (!analysis) {
                    throw new Error('Gemini no devolvió respuesta válida');
                }
                
                updateStatus('✅ ¡Respuesta encontrada!');
                addLog('Respuesta recibida de Gemini', 'success');
                
                result.innerHTML = `<div class="result-box">${formatResult(analysis)}</div>`;
                
                // Extraer respuesta correcta y leerla
                const match = analysis.match(/✅\s*RESPUESTA CORRECTA:\s*([A-D])\s*[-–]\s*(.+)/i);
                if (match) {
                    const letter = match[1];
                    const text = match[2].trim();
                    const speakText = `Respuesta correcta: ${letter}. ${text}`;
                    addLog(`Leyendo: ${speakText}`, 'info');
                    speakAnswer(speakText);
                } else {
                    addLog('No se pudo extraer la respuesta para leer', 'error');
                }
                
            } catch (err) {
                console.error('Error:', err);
                updateStatus(`❌ Error: ${err.message}`);
                addLog(`Error: ${err.message}`, 'error');
            } finally {
                isProcessing = false;
            }
        }
        
        function formatResult(text) {
            return text
                .replace(/📚/g, '<br>📚')
                .replace(/🔢/g, '<br>🔢')
                .replace(/❓/g, '<br>❓')
                .replace(/📝/g, '<br>📝')
                .replace(/✅/g, '<br><br>✅')
                .replace(/💡/g, '<br><br>💡')
                .replace(/\n/g, '<br>');
        }
        
        function speakAnswer(text) {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
                
                // Pequeño delay para que el cancel surta efecto
                setTimeout(() => {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'es-MX';
                    utterance.rate = 1.0;
                    utterance.pitch = 1;
                    utterance.volume = Math.min(parseFloat(volumenSelect.value), 1);
                    
                    const voices = speechSynthesis.getVoices();
                    const spanishVoice = voices.find(v => 
                        v.lang.includes('es') && (v.name.includes('Mexico') || v.name.includes('MX'))
                    ) || voices.find(v => v.lang.includes('es'));
                    
                    if (spanishVoice) {
                        utterance.voice = spanishVoice;
                        addLog(`Voz: ${spanishVoice.name}`, 'info');
                    }
                    
                    utterance.onend = () => addLog('Audio completado', 'success');
                    utterance.onerror = (e) => addLog('Error audio: ' + e.error, 'error');
                    
                    speechSynthesis.speak(utterance);
                }, 100);
            } else {
                addLog('SpeechSynthesis no disponible', 'error');
            }
        }
        
        function updateStatus(msg) {
            const spinner = isProcessing ? '<span class="spinner"></span>' : '';
            status.querySelector('p').innerHTML = `${spinner}${msg}`;
        }
        
        function stopAll() {
            if (intervalId) clearInterval(intervalId);
            if (countdownId) clearInterval(countdownId);
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            speechSynthesis.cancel();
            isProcessing = false;
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            captureBtn.disabled = true;
            timerDisplay.textContent = '';
            updateStatus('⏹️ Detenido');
            addLog('Detenido por usuario', 'info');
        }
        
        // Event listeners
        startBtn.addEventListener('click', startCamera);
        stopBtn.addEventListener('click', stopAll);
        captureBtn.addEventListener('click', () => {
            if (!isProcessing) {
                captureAndAnalyze();
            }
        });
        
        // Cargar voces
        if ('speechSynthesis' in window) {
            speechSynthesis.getVoices();
            speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
        }
        
        // Mantener pantalla activa
        let wakeLock = null;
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    addLog('Wake Lock activado', 'info');
                } catch (e) {
                    addLog('Wake Lock no disponible', 'info');
                }
            }
        }
        
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && wakeLock) {
                requestWakeLock();
            }
        });
        
        // Inicializar
        captureBtn.disabled = true;
        updateStatus('📱 Ingresa tu API Key y presiona Iniciar');
        addLog('App iniciada. Esperando API Key...', 'info');
        requestWakeLock();
    </script>
</body>
</html>
